version: '3.7'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iti_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      - postgres
      - redis
    networks:
      - iti_network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: iti_postgres
    environment:
      POSTGRES_DB: iti_instructor_task
      POSTGRES_USER: iti_user
      POSTGRES_PASSWORD: "ITI_Task_2026!"
    ports:
      - "5433:5432"
    volumes:
      - iti_postgres_data:/var/lib/postgresql/data
    networks:
      - iti_network

  redis:
    image: redis:7-alpine
    container_name: iti_redis
    ports:
      - "6380:6379"
    networks:
      - iti_network

networks:
  iti_network:
    driver: bridge

volumes:
  iti_postgres_data: